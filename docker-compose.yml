# --- КОНЕЦ ЗАКОММЕНТИРОВАННОГО AI СЕРВИСА ---

  frontend:
    restart: unless-stopped
    build: ./services/frontend
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ---  МОНИТОРИНГ: PROMETHEUS ---
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    container_name: saqbol_prometheus
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - lms_network
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---  МОНИТОРИНГ: GRAFANA ---
  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    container_name: saqbol_grafana
    ports:
      - "3000:3000"
    networks:
      - lms_network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin 
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana 
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    container_name: saqbol_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      core_service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_core:
  static_volume:
  media_volume:
  grafana_data: 

networks:
  lms_network:
